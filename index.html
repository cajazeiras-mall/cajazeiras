<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cajazeiras Mall</title>
  <style>
    /* Estilos Gerais */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
    }

    /* Container de Categorias */
    .categories-section {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .categories-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .categories-header h2 {
      font-size: 1.25rem;
      color: #0d1b2a;
    }

    .categories-header a {
      color: #4a6fa5;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: bold;
    }

    /* Grid do Desktop */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .category-card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      text-decoration: none;
      color: #333;
      transition: transform 0.2s ease;
    }

    .category-card:hover {
      transform: translateY(-2px);
    }

    .icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .icon-wrapper svg {
      width: 24px;
      height: 24px;
    }

    /* Cores dos Ícones */
    .bg-alimentacao { background-color: #e6f4ff; fill: #0077ff; }
    .bg-artesanato { background-color: #f0ebff; fill: #6f42c1; }
    .bg-beleza { background-color: #e6f9f0; fill: #00b894; }

    .category-card span {
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    /* RESPONSIVO PARA CELULAR (3 botões menores em 1 linha) */
    @media (max-width: 768px) {
      .categories-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .category-card {
        padding: 10px 4px;
        border-radius: 8px;
      }

      .icon-wrapper {
        width: 36px;
        height: 36px;
        margin-bottom: 4px;
      }

      .icon-wrapper svg {
        width: 18px;
        height: 18px;
      }

      .category-card span {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <section class="categories-section">
    <div class="categories-header">
      <h2>Navegue por Categorias</h2>
      <a href="#">VER TODAS &rarr;</a>
    </div>

    <div class="categories-grid">
      <!-- Categoria 1 -->
      <a href="#" class="category-card">
        <div class="icon-wrapper bg-alimentacao">
          <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.38l-.95 7.62h3l-.95-7.62C9.54 12.9 11 11.12 11 9zm5-7v18h3V2h-3z"/></svg>
        </div>
        <span>Alimentação</span>
      </a>

      <!-- Categoria 2 -->
      <a href="#" class="category-card">
        <div class="icon-wrapper bg-artesanato">
          <svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 13c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
        </div>
        <span>Artesanato</span>
      </a>

      <!-- Categoria 3 -->
      <a href="#" class="category-card">
        <div class="icon-wrapper bg-beleza">
          <svg viewBox="0 0 24 24"><path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/></svg>
        </div>
        <span>Beleza</span>
      </a>
    </div>
  </section>

</body>
</html>
