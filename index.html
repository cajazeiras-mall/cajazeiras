<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cajazeiras Mall</title>
  <style>
    /* Estilos Gerais */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
    }

    /* Topo / Header */
    .site-header {
      background-color: #0d1b2a;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-area img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    .logo-area span {
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .logo-area span span {
      color: #fca311;
    }

    /* Seção Hero mais compacta com Chamada para Cadastro */
    .hero-section {
      background: linear-gradient(rgba(13, 27, 42, 0.75), rgba(13, 27, 42, 0.75)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%231b263b" width="100" height="100"/></svg>');
      background-size: cover;
      background-position: center;
      padding: 24px 16px;
      text-align: center;
      color: #fff;
    }

    .hero-content h1 {
      font-size: 1.25rem;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .hero-content h1 span {
      color: #fca311;
    }

    .hero-content p {
      font-size: 0.85rem;
      margin-bottom: 16px;
      color: #e0e0e0;
    }

    /* Botão de Cadastro no lugar da Pesquisa */
    .btn-cadastro {
      display: inline-block;
      background-color: #fca311;
      color: #0d1b2a;
      padding: 10px 24px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }

    .btn-cadastro:hover {
      background-color: #e59400;
    }

    /* Container de Categorias */
    .categories-section {
      max-width: 1200px;
      margin: 16px auto;
      padding: 0 12px;
    }

    .categories-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .categories-header h2 {
      font-size: 1.1rem;
      color: #0d1b2a;
    }

    .categories-header a {
      color: #4a6fa5;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: bold;
    }

    /* Grid do Desktop */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .category-card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      text-decoration: none;
      color: #333;
      transition: transform 0.2s ease;
    }

    .category-card:hover {
      transform: translateY(-2px);
    }

    .icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .icon-wrapper svg {
      width: 24px;
      height: 24px;
    }

    /* Cores dos Ícones */
    .bg-alimentacao { background-color: #e6f4ff; fill: #0077ff; }
    .bg-artesanato { background-color: #f0ebff; fill: #6f42c1; }
    .bg-beleza { background-color: #e6f9f0; fill: #00b894; }

    .category-card span {
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    /* RESPONSIVO PARA CELULAR (3 botões menores em 1 linha e Hero compacto) */
    @media (max-width: 768px) {
      .hero-section {
        padding: 18px 12px;
      }

      .hero-content h1 {
        font-size: 1.1rem;
      }

      .hero-content p {
        font-size: 0.8rem;
        margin-bottom: 12px;
      }

      .btn-cadastro {
        padding: 8px 20px;
        font-size: 0.85rem;
      }

      .categories-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .category-card {
        padding: 8px 2px;
        border-radius: 8px;
      }

      .icon-wrapper {
        width: 32px;
        height: 32px;
        margin-bottom: 4px;
      }

      .icon-wrapper svg {
        width: 16px;
        height: 16px;
      }

      .category-card span {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- Topo -->
  <header class="site-header">
    <div class="logo-area">
      <span>Cajazeiras <span>Mall</span></span>
    </div>
  </header>

  <!-- Seção Hero Compacta com Chamada de Cadastro -->
  <section class="hero-section">
    <div class="hero-content">
      <h1>Cajazeiras <span>Mall</span></h1>
      <p>O comércio de Cajazeiras reunido em um só lugar.</p>
      <a href="#" class="btn-cadastro">Cadastre seu Negócio</a>
    </div>
  </section>

  <!-- Seção de Categorias (3 Primeiras no Celular) -->
  <section class="categories-section">
    <div class="categories-header">
      <h2>Navegue por Categorias</h2>
      <a href="#">VER TODAS &rarr;</a>
    </div>

    <div class="categories-grid">
      <!-- Categoria 1 -->
      <a href="#" class="category-card">
        <div class="icon-wrapper bg-alimentacao">
          <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.38l-.95 7.62h3l-.95-7.62C9.54 12.9 11 11.12 11 9zm5-7v18h3V2h-3z"/></svg>
        </div>
        <span>Alimentação</span>
      </a>

      <!-- Categoria 2 -->
      <a href="#" class="category-card">
        <div class="icon-wrapper bg-artesanato">
          <svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 13c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
        </div>
        <span>Artesanato</span>
      </a>

      <!-- Categoria 3 -->
      <a href="#" class="category-card">
        <div class="icon-wrapper bg-beleza">
          <svg viewBox="0 0 24 24"><path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/></svg>
        </div>
        <span>Beleza</span>
      </a>
    </div>
  </section>

</body>
</html>
