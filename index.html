<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cajazeiras Mall</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#dc2626">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <!-- CABEÇALHO -->
  <header class="bg-red-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
        <i class="fa-solid font-bold fa-store"></i> Cajazeiras Mall
      </h1>
      <button onclick="abrirModalAdmin()" class="text-xs bg-red-700 hover:bg-red-800 px-3 py-1.5 rounded transition font-medium flex items-center gap-1">
        <i class="fa-solid fa-lock"></i> Painel Admin
      </button>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-4xl mx-auto px-4 py-6">

    <!-- ABAS -->
    <div class="flex border-b border-gray-200 mb-6 bg-white rounded-t shadow-sm">
      <button id="btn-aba-comercios" onclick="mudarAba('comercios')" class="flex-1 py-3 px-4 text-center font-semibold text-red-600 border-b-2 border-red-600 flex justify-center items-center gap-2">
        <i class="fa-solid fa-shop"></i> Comércios
      </button>
      <button id="btn-aba-noticias" onclick="mudarAba('noticias')" class="flex-1 py-3 px-4 text-center font-semibold text-gray-500 hover:text-red-600 border-b-2 border-transparent flex justify-center items-center gap-2">
        <i class="fa-solid fa-newspaper"></i> Notícias
      </button>
    </div>

    <!-- SEÇÃO COMÉRCIOS -->
    <section id="secao-comercios">
      <div id="lista-comercios" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-gray-500 text-sm col-span-2">A carregar comércios...</p>
      </div>
    </section>

    <!-- SEÇÃO NOTÍCIAS -->
    <section id="secao-noticias" class="hidden">
      <div id="feed-noticias" class="space-y-4">
        <p class="text-gray-500 text-sm">A carregar notícias...</p>
      </div>
    </section>

  </main>

  <!-- MODAL ADMIN -->
  <div id="modal-admin" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg text-gray-800">Painel do Administrador</h3>
        <button onclick="fecharModalAdmin()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div id="admin-login-form" class="space-y-3">
        <label class="block text-sm font-medium text-gray-700">Senha de Acesso</label>
        <input type="password" id="input-senha-admin" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        <button onclick="autenticarAdmin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded text-sm transition">Entrar</button>
      </div>

      <div id="admin-painel-conteudo" class="hidden space-y-4">
        <button onclick="abrirFormComercio()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded text-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus"></i> Adicionar Novo Comércio
        </button>
        <hr>
        <div id="admin-lista-gerenciar" class="space-y-2 max-h-60 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <!-- MODAL FORMULÁRIO COMÉRCIO -->
  <div id="modal-form-comercio" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="form-titulo" class="font-bold text-lg text-gray-800">Cadastrar Comércio</h3>
        <button onclick="fecharFormComercio()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <input type="hidden" id="form-id">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nome</label>
        <input type="text" id="form-nome" class="w-full border rounded px-3 py-1.5 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Categoria</label>
        <input type="text" id="form-categoria" class="w-full border rounded px-3 py-1.5 text-sm" placeholder="Ex: Alimentação, Serviços...">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Descrição</label>
        <textarea id="form-descricao" class="w-full border rounded px-3 py-1.5 text-sm" rows="2"></textarea>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">WhatsApp (Apenas números)</label>
        <input type="text" id="form-whatsapp" class="w-full border rounded px-3 py-1.5 text-sm" placeholder="5585999999999">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Instagram (@usuario ou Link)</label>
        <input type="text" id="form-instagram" class="w-full border rounded px-3 py-1.5 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Endereço</label>
        <input type="text" id="form-endereco" class="w-full border rounded px-3 py-1.5 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">URL da Foto/Logotipo</label>
        <input type="text" id="form-foto" class="w-full border rounded px-3 py-1.5 text-sm">
      </div>

      <button onclick="salvarComercio()" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded text-sm transition mt-2">Salvar</button>
    </div>
  </div>

  <!-- SCRIPTS DA APLICAÇÃO -->
  <script src="config.js"></script>
  <script>
    let senhaSalva = '';
    let listaComerciosCache = [];

    document.addEventListener('DOMContentLoaded', () => {
      carregarComercios();
      carregarNoticias();
      
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    });

    function mudarAba(aba) {
      const btnComercios = document.getElementById('btn-aba-comercios');
      const btnNoticias = document.getElementById('btn-aba-noticias');
      const secComercios = document.getElementById('secao-comercios');
      const secNoticias = document.getElementById('secao-noticias');

      if (aba === 'comercios') {
        secComercios.classList.remove('hidden');
        secNoticias.classList.add('hidden');
        btnComercios.className = 'flex-1 py-3 px-4 text-center font-semibold text-red-600 border-b-2 border-red-600 flex justify-center items-center gap-2';
        btnNoticias.className = 'flex-1 py-3 px-4 text-center font-semibold text-gray-500 hover:text-red-600 border-b-2 border-transparent flex justify-center items-center gap-2';
      } else {
        secComercios.classList.add('hidden');
        secNoticias.classList.remove('hidden');
        btnNoticias.className = 'flex-1 py-3 px-4 text-center font-semibold text-red-600 border-b-2 border-red-600 flex justify-center items-center gap-2';
        btnComercios.className = 'flex-1 py-3 px-4 text-center font-semibold text-gray-500 hover:text-red-600 border-b-2 border-transparent flex justify-center items-center gap-2';
      }
    }

    async function carregarComercios() {
      const container = document.getElementById('lista-comercios');
      try {
        const res = await fetch(`${window.API_URL}?acao=comercios`);
        const data = await res.json();

        if (data.ok && data.comercios) {
          listaComerciosCache = data.comercios;
          renderizarComercios(data.comercios);
        } else {
          container.innerHTML = '<p class="text-gray-500 text-sm col-span-2">Nenhum comércio cadastrado.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p class="text-red-500 text-sm col-span-2">Erro ao carregar comércios.</p>';
      }
    }

    function renderizarComercios(lista) {
      const container = document.getElementById('lista-comercios');
      if (lista.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-sm col-span-2">Nenhum comércio disponível.</p>';
        return;
      }

      container.innerHTML = lista.map(c => `
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-4 flex gap-4 items-start">
          ${c.foto ? `<img src="${c.foto}" class="w-20 h-20 object-cover rounded shadow-xs flex-shrink-0" alt="${c.nome}">` : '<div class="w-20 h-20 bg-gray-100 rounded flex items-center justify-center text-gray-400 flex-shrink-0"><i class="fa-solid fa-store text-2xl"></i></div>'}
          <div class="flex-1 min-w-0">
            <span class="text-[10px] font-bold bg-red-50 text-red-600 px-2 py-0.5 rounded uppercase tracking-wider">${c.categoria || 'Geral'}</span>
            <h3 class="font-bold text-gray-800 text-base leading-tight mt-1 truncate">${c.nome}</h3>
            <p class="text-xs text-gray-600 mt-1 line-clamp-2">${c.descricao || ''}</p>
            ${c.endereco ? `<p class="text-[11px] text-gray-400 mt-1 truncate"><i class="fa-solid fa-location-dot"></i> ${c.endereco}</p>` : ''}
            <div class="flex gap-2 mt-3">
              ${c.whatsapp ? `<a href="https://wa.me/${c.whatsapp.replace(/\D/g,'')}" target="_blank" class="bg-green-500 text-white text-xs px-2.5 py-1 rounded font-medium flex items-center gap-1 hover:bg-green-600"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>` : ''}
              ${c.instagram ? `<a href="${c.instagram.startsWith('http') ? c.instagram : 'https://instagram.com/' + c.instagram.replace('@','')}" target="_blank" class="bg-pink-600 text-white text-xs px-2.5 py-1 rounded font-medium flex items-center gap-1 hover:bg-pink-700"><i class="fa-brands fa-instagram"></i> Instagram</a>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    async function carregarNoticias() {
      const container = document.getElementById('feed-noticias');
      if (!container) return;

      container.innerHTML = '<p class="text-gray-500 text-sm">A carregar notícias...</p>';

      try {
        const res = await fetch(`${window.API_URL}?acao=noticias`);
        const data = await res.json();

        if (!data.ok || !data.noticias || data.noticias.length === 0) {
          container.innerHTML = '<p class="text-gray-500 text-sm">Nenhuma notícia disponível no momento.</p>';
          return;
        }

        let html = '';
        data.noticias.forEach(grupo => {
          if (grupo.itens && grupo.itens.length > 0) {
            html += `<div class="mt-4 mb-2"><span class="font-bold text-sm text-red-700 bg-red-50 px-2 py-1 rounded">${grupo.fonte} (${grupo.tag})</span></div>`;
            grupo.itens.forEach(item => {
              html += `
                <div class="mb-3 p-3 bg-white rounded shadow-sm border border-gray-100 hover:border-gray-300 transition">
                  <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="font-semibold text-blue-600 hover:underline block mb-1">
                    ${item.titulo}
                  </a>
                  <p class="text-xs text-gray-600 mb-1">${item.resumo}...</p>
                  <span class="text-[10px] text-gray-400">${item.data}</span>
                </div>
              `;
            });
          }
        });

        container.innerHTML = html || '<p class="text-gray-500 text-sm">Nenhuma notícia encontrada.</p>';
      } catch (err) {
        container.innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar notícias. Tente novamente mais tarde.</p>';
      }
    }

    // FUNÇÕES DO PAINEL ADMIN
    function abrirModalAdmin() {
      document.getElementById('modal-admin').classList.remove('hidden');
    }
    function fecharModalAdmin() {
      document.getElementById('modal-admin').classList.add('hidden');
    }

    function autenticarAdmin() {
      const senha = document.getElementById('input-senha-admin').value;
      if (!senha) return alert('Digite a senha!');
      senhaSalva = senha;
      document.getElementById('admin-login-form').classList.add('hidden');
      document.getElementById('admin-painel-conteudo').classList.remove('hidden');
      renderizarAdminGerenciador();
    }

    function renderizarAdminGerenciador() {
      const container = document.getElementById('admin-lista-gerenciar');
      container.innerHTML = listaComerciosCache.map(c => `
        <div class="flex justify-between items-center p-2 bg-gray-50 rounded border text-xs">
          <span class="font-bold text-gray-700 truncate max-w-[180px]">${c.nome}</span>
          <div class="flex gap-2">
            <button onclick="editarComercio('${c.id}')" class="text-blue-600 font-semibold hover:underline">Editar</button>
            <button onclick="excluirComercio('${c.id}')" class="text-red-600 font-semibold hover:underline">Excluir</button>
          </div>
        </div>
      `).join('');
    }

    function abrirFormComercio() {
      document.getElementById('form-titulo').innerText = 'Cadastrar Comércio';
      document.getElementById('form-id').value = '';
      document.getElementById('form-nome').value = '';
      document.getElementById('form-categoria').value = '';
      document.getElementById('form-descricao').value = '';
      document.getElementById('form-whatsapp').value = '';
      document.getElementById('form-instagram').value = '';
      document.getElementById('form-endereco').value = '';
      document.getElementById('form-foto').value = '';
      document.getElementById('modal-form-comercio').classList.remove('hidden');
    }

    function fecharFormComercio() {
      document.getElementById('modal-form-comercio').classList.add('hidden');
    }

    function editarComercio(id) {
      const c = listaComerciosCache.find(item => item.id == id);
      if (!c) return;

      document.getElementById('form-titulo').innerText = 'Editar Comércio';
      document.getElementById('form-id').value = c.id;
      document.getElementById('form-nome').value = c.nome || '';
      document.getElementById('form-categoria').value = c.categoria || '';
      document.getElementById('form-descricao').value = c.descricao || '';
      document.getElementById('form-whatsapp').value = c.whatsapp || '';
      document.getElementById('form-instagram').value = c.instagram || '';
      document.getElementById('form-endereco').value = c.endereco || '';
      document.getElementById('form-foto').value = c.foto || '';

      document.getElementById('modal-form-comercio').classList.remove('hidden');
    }

    async function salvarComercio() {
      const comercio = {
        id: document.getElementById('form-id').value,
        nome: document.getElementById('form-nome').value,
        categoria: document.getElementById('form-categoria').value,
        descricao: document.getElementById('form-descricao').value,
        whatsapp: document.getElementById('form-whatsapp').value,
        instagram: document.getElementById('form-instagram').value,
        endereco: document.getElementById('form-endereco').value,
        foto: document.getElementById('form-foto').value
      };

      if (!comercio.nome) return alert('O nome é obrigatório!');

      try {
        const res = await fetch(window.API_URL, {
          method: 'POST',
          body: JSON.stringify({
            senha: senhaSalva,
            acao: 'salvarComercio',
            comercio: comercio
          })
        });
        const data = await res.json();
        if (data.ok) {
          alert('Salvo com sucesso!');
          fecharFormComercio();
          carregarComercios();
        } else {
          alert('Erro: ' + data.erro);
        }
      } catch (e) {
        alert('Erro ao ligar ao servidor.');
      }
    }

    async function excluirComercio(id) {
      if (!confirm('Deseja realmente excluir este comércio?')) return;

      try {
        const res = await fetch(window.API_URL, {
          method: 'POST',
          body: JSON.stringify({
            senha: senhaSalva,
            acao: 'excluirComercio',
            id: id
          })
        });
        const data = await res.json();
        if (data.ok) {
          alert('Excluído com sucesso!');
          carregarComercios();
        } else {
          alert('Erro: ' + data.erro);
        }
      } catch (e) {
        alert('Erro ao ligar ao servidor.');
      }
    }
  </script>
</body>
</html>
